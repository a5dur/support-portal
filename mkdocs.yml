site_url: https://a5dur.github.io/support-portal/
docs_dir: freshdesk_export
site_dir: site

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Inter
    code: Roboto Mono

extra_css:
